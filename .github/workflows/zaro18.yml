name: zaro18-20nick

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.50'
        type: string

# CHẶN TRÙNG LẶP CẤP WORKFLOW: Chỉ cho phép duy nhất 1 luồng zaro18-20nick chạy cùng lúc
concurrency:
  group: workflow-zaro18-20nick
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    name: "Bot ${{ matrix.slot }}"
    runs-on: ubuntu-latest
    timeout-minutes: 345

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - slot: '01'
            user_secret: ZARO01_USER
            pass_secret: ZARO01_PASSWD
          - slot: '02'
            user_secret: ZARO02_USER
            pass_secret: ZARO02_PASSWD
          - slot: '03'
            user_secret: ZARO03_USER
            pass_secret: ZARO03_PASSWD
          - slot: '04'
            user_secret: ZARO04_USER
            pass_secret: ZARO04_PASSWD
          - slot: '05'
            user_secret: ZARO05_USER
            pass_secret: ZARO05_PASSWD
          - slot: '06'
            user_secret: ZARO06_USER
            pass_secret: ZARO06_PASSWD
          - slot: '07'
            user_secret: ZARO07_USER
            pass_secret: ZARO07_PASSWD
          - slot: '08'
            user_secret: ZARO08_USER
            pass_secret: ZARO08_PASSWD
          - slot: '09'
            user_secret: ZARO09_USER
            pass_secret: ZARO09_PASSWD
          - slot: '10'
            user_secret: ZARO10_USER
            pass_secret: ZARO10_PASSWD
          - slot: '11'
            user_secret: ZARO11_USER
            pass_secret: ZARO11_PASSWD
          - slot: '12'
            user_secret: ZARO12_USER
            pass_secret: ZARO12_PASSWD
          - slot: '13'
            user_secret: ZARO13_USER
            pass_secret: ZARO13_PASSWD
          - slot: '14'
            user_secret: ZARO14_USER
            pass_secret: ZARO14_PASSWD
          - slot: '15'
            user_secret: ZARO15_USER
            pass_secret: ZARO15_PASSWD
          - slot: '16'
            user_secret: ZARO16_USER
            pass_secret: ZARO16_PASSWD
          - slot: '17'
            user_secret: ZARO17_USER
            pass_secret: ZARO17_PASSWD
          - slot: '18'
            user_secret: ZARO18_USER
            pass_secret: ZARO18_PASSWD
          - slot: '19'
            user_secret: ZARO19_USER
            pass_secret: ZARO19_PASSWD
          - slot: '20'
            user_secret: ZARO20_USER
            pass_secret: ZARO20_PASSWD

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websocket-client requests --break-system-packages

      - name: Cache Pikafish engine
        id: cache-pikafish
        uses: actions/cache@v4
        with:
          path: |
            ~/pikafish
            ~/pikafish.nnue
          key: pikafish-2026-01-02-linux

      - name: Download Pikafish engine + NNUE
        if: steps.cache-pikafish.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          PK_URL: https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-01-02/Pikafish.2026-01-02.7z
        run: |
          set -e
          python3 -m pip install --quiet py7zr

          curl -fL --retry 4 --retry-delay 5 --retry-all-errors --max-time 420 -o /tmp/pikafish.7z "$PK_URL"
          ls -lh /tmp/pikafish.7z

          if grep -q avx512vnni /proc/cpuinfo; then BIN=pikafish-vnni512
          elif grep -q avx512f /proc/cpuinfo;  then BIN=pikafish-avx512
          elif grep -q bmi2 /proc/cpuinfo;     then BIN=pikafish-bmi2
          elif grep -q avx2 /proc/cpuinfo;     then BIN=pikafish-avx2
          else BIN=pikafish-sse41-popcnt; fi
          echo "[ENGINE] CPU hợp với $BIN"

          python3 - "$BIN" <<'PY'
          import os, shutil, sys, py7zr
          binname = sys.argv[1]
          targets = {f"Linux/{binname}", "Linux/pikafish-sse41-popcnt", "pikafish.nnue"}
          with py7zr.SevenZipFile("/tmp/pikafish.7z") as z:
              z.extract(path="/tmp/pikafish", targets=sorted(targets))
          home = os.path.expanduser("~")
          shutil.copy(f"/tmp/pikafish/Linux/{binname}", f"{home}/pikafish")
          shutil.copy("/tmp/pikafish/pikafish.nnue", f"{home}/pikafish.nnue")
          os.chmod(f"{home}/pikafish", 0o755)
          print(f"[ENGINE] Đã cài {binname} + NNUE vào {home}")
          PY

          if ! printf "uci\nquit\n" | "$HOME/pikafish" > /dev/null 2>&1; then
            echo "[ENGINE] $BIN không chạy được -> fallback sse41-popcnt"
            cp /tmp/pikafish/Linux/pikafish-sse41-popcnt "$HOME/pikafish"
            chmod +x "$HOME/pikafish"
          fi

      - name: Verify engine
        timeout-minutes: 3
        run: |
          chmod +x "$HOME/pikafish"
          ls -lh "$HOME/pikafish" "$HOME/pikafish.nnue"
          printf "uci\nquit\n" | "$HOME/pikafish" | head -n 3

      - name: Check account secrets
        env:
          BOT_USER: ${{ secrets[matrix.user_secret] }}
          BOT_PASSWD: ${{ secrets[matrix.pass_secret] }}
        run: |
          if [ -z "$BOT_USER" ] || [ -z "$BOT_PASSWD" ]; then
            echo "::error::Thiếu secret cho Bot ${{ matrix.slot }}: ${{ matrix.user_secret }} / ${{ matrix.pass_secret }}"
            exit 1
          fi
          echo "Bot ${{ matrix.slot }}: đã nhận đủ username/password từ Secrets."

      - name: Run Xiangqi Bot ${{ matrix.slot }}
        env:
          BOT_USER: ${{ secrets[matrix.user_secret] }}
          BOT_PASSWD: ${{ secrets[matrix.pass_secret] }}
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.5' }}
        run: |
          echo "Starting bot ${{ matrix.slot }}; auto-restart until job timeout (~6h)"
          START_TIME=$(date +%s)
          MAX_SECONDS=19800 # ~5.83 giờ

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))
            if [ $ELAPSED -ge $MAX_SECONDS ]; then
              echo "Thời gian chạy đến giới hạn an toàn (5.8h). Đang dừng bot..."
              break
            fi

            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting zaro18.py for Bot ${{ matrix.slot }} ==="
            python3 -u zaro18.py || echo "zaro18.py exited with code $?"
            echo "Restarting bot ${{ matrix.slot }} in 1 second"
            sleep 1
          done

  # JOB TỰ ĐỘNG TRIGGER: Chỉ chạy ĐÚNG 1 LẦN sau khi toàn bộ 20 bot ở trên đã hoàn thành
  trigger-next:
    name: "Trigger Next Cycle"
    needs: run-bot
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Trigger next run automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Sending single dispatch request to run next workflow..."
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/zaro18-20nick.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
